# =============================================================================
#  Goose Client-Profil  ·  Tenant "gericom"  ·  LLMProxy2
# =============================================================================
#  Leichtgewichtiges Desktop-/CLI-Frontend fuer Endanwender (Alternative zu
#  VS Code + LenaX). Goose spricht ausschliesslich den LLMProxy-Endpoint an,
#  damit Fleet-Routing, Fallback und #routes-Monitoring greifen.
#
#  Diese Datei enthaelt NUR nicht-geheime Provider-Einstellungen.
#  Der (aktuell leere) API-Key und das Deaktivieren des Windows-Keyrings
#  werden vom Launcher (goose-gericom.cmd) als Umgebungsvariablen gesetzt.
#
#  Zielort auf dem Anwender-PC:
#    %APPDATA%\Block\goose\config\config.yaml
#  Wird von install.ps1 dorthin kopiert.
# -----------------------------------------------------------------------------

# --- Provider: eingebauter openai-Provider, auf den Proxy umgebogen ----------
GOOSE_PROVIDER: openai
GOOSE_MODEL: "auto:code"          # auto:code -> Qwen: liefert zuverlaessig native tool_calls ueber den Proxy.
                                  # auto:chat -> jetzt Qwen3.6 (frueher mistral-24b OHNE tool_calls): ebenfalls
                                  # tool-faehig, native tool_calls verifiziert 2026-09-24. Kein Toolshim mehr noetig.
                                  # auto:code bleibt Default fuer Agent/Tool-Arbeit (staerkstes Reasoning).

# Endpoint = OPENAI_HOST + "/" + OPENAI_BASE_PATH
#   -> https://t78.ch/apps/proxy/gericom/jumpserver.ashx/v1/chat/completions
OPENAI_HOST: "https://t78.ch"
OPENAI_BASE_PATH: "apps/proxy/gericom/jumpserver.ashx/v1/chat/completions"

# --- Client-Identity-Header (Pflicht-Satz, sonst nur IP im #routes-Monitor) --
# Format: kommagetrennt, HEADER=WERT. Wird an den lokalen Tenant gesendet.
OPENAI_CUSTOM_HEADERS: "X-Title=Goose,X-Client=Goose,X-Client-Site=gericom,X-Client-Version=1.50.0,X-Client-OS=Windows"

# --- Verhalten ----------------------------------------------------------------
# auto = vollautonom (keine Rueckfragen, auch nicht vor Ueberschreiben/Loeschen).
# Bewusst als Laien-Default (klare Aufgaben ohne staendige Entscheidungen).
# Sicherere Alternative: smart_approve (fragt nur bei riskanten Aktionen).
# Umschaltbar in Einstellungen -> Modus.
GOOSE_MODE: auto
GOOSE_MAX_TURNS: 1000              # Sicherheitsnetz gegen Endlosschleifen
# WICHTIG: Output-Token-Budget moderat halten. Ein zu grosser Wert (getestet: 16000)
# reserviert so viel Output, dass ausgelastete/kleine Serving-Nodes den Request nicht mehr
# verarbeiten (Node haengt, 0 Tokens; LenaX-Warnung bestaetigt). 4096 laeuft zuverlaessig;
# abgeschnittene Turns setzt der Agent dank finish_reason:length-Fix automatisch fort.
GOOSE_MAX_TOKENS: 4096
# Output-Budget NUR für die Verdichtungs-Zusammenfassung (Compaction), entkoppelt von
# GOOSE_MAX_TOKENS: ein grosser Wert hier betrifft nur den seltenen Einzel-Request der
# Verdichtung, nicht die Reservierung pro Turn (die bei grossen Werten Serving-Nodes hängen
# liess). Ohne Eintrag gilt automatisch das Doppelte des Per-Turn-Budgets, also aktuell
# 2 x 4096 = 8192. Nur setzen, wenn ein fester, von GOOSE_MAX_TOKENS unabhängiger Wert
# gewünscht ist:
# GOOSE_COMPACTION_MAX_TOKENS: 8192
GOOSE_DISABLE_KEYRING: true        # Windows: Secrets ueber Env statt Keyring
GOOSE_TELEMETRY_ENABLED: true      # Nutzungs-Events an EIGENES EU-PostHog; unterdrueckt Consent-Dialog
# Toolshim AUS: native tool_calls (auto:code -> qwen3.8-27b) sind der zuverlaessige Weg.
# Toolshim injizierte Tool-Beschreibungen nur in den Prompt und parste Text -> unzuverlaessig
# bei Shell/Compute (siehe T4). Der UI-Toggle bleibt als Fallback fuer nicht-tool-faehige Modelle.
GOOSE_TOOLSHIM: false
GOOSE_TOOLSHIM_OLLAMA_MODEL: "qwen2.5:3b"

# --- Eigene Zusatz-Modelle (ergaenzen die Live-Liste vom Proxy) ---------------
# Das Modell-Dropdown wird LIVE aus dem Proxy (/v1/models, nur die auto:*-Tags)
# gefuellt. Hier kannst du es ZUSAETZLICH ergaenzen, ohne den Proxy zu aendern.
# Jeder Eintrag erscheint zusaetzlich im Dropdown und routet ueber denselben
# t78.ch-Provider und -Key. "name" = exakte Modell-ID, wie der Proxy sie kennt.
# Doppelte IDs werden automatisch zusammengefuehrt (kein Duplikat im Dropdown).
#
# tb_extra_models:
#   - name: qwen3.8-27b-tbs          # konkrete Fleet-Modell-ID (ueber t78.ch erreichbar)
#     alias: "Qwen3.8 27B"           # Anzeigename im Dropdown
#     subtext: "Konkret, ueber t78.ch"
#     context_limit: 131072
#   - name: auto:chat                # bestehendes Live-Tag nur umbenennen
#     alias: "Auto: Chat (schnell)"
#
# Optional: Live-Tags im Dropdown ausblenden. So reduzierst du z. B. auf genau
# auto:code / auto:chat / auto:fast, indem du Vision und Image ausblendest:
#
# tb_hide_models:
#   - auto:vision
#   - auto:image

# --- Fremde openai-kompatible Endpunkte (eigene Provider neben t78) -----------
# Hier definierst du ZUSAETZLICHE Anbieter mit EIGENEM Endpunkt (eigener Server,
# api.deepseek.com, ein anderer Proxy-Tenant ...). TB-Goose schreibt daraus beim
# Start automatisch goose-native Provider-Dateien (custom_providers\custom_<id>.json)
# und hinterlegt den Key in secrets.yaml. Die Modelle erscheinen dann unter
# "anderen Anbieter verwenden" in der Modellauswahl.
#
# tb_providers:
#   - id: deepseek                         # -> Provider "custom_deepseek"
#     name: DeepSeek
#     base_url: https://api.deepseek.com/v1
#     api_key: sk-...                      # weglassen, wenn der Endpunkt keinen Key braucht
#     models:
#       - deepseek-v4-flash
#       - { name: deepseek-v4-pro, context_limit: 131072 }
#
# Optional kannst du so ein Modell auch in die kuratierte Liste oben heben, indem du
# bei tb_extra_models zusaetzlich "provider" setzt (sonst laeuft es ueber t78):
#   tb_extra_models:
#     - name: deepseek-v4-flash
#       alias: "DeepSeek Flash"
#       provider: custom_deepseek
